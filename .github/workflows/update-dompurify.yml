name: Update DOMPurify

# DOMPurify（XSS無害化ライブラリ）を毎週、最新の 3.x 系へ自動更新する。
# 自ホスト（vendor/dompurify/）方式のため、新バージョンのファイルをダウンロードして
# 差し替え、nb/index.html の参照ファイル名（バージョン入り）を更新し、
# 変更があれば自動コミット＆プッシュする。
# メジャー更新（4.x など）はAPI互換性の都合で自動対象外（手動レビュー）。

on:
  schedule:
    - cron: '0 0 * * 1'   # 毎週月曜 00:00 UTC
  workflow_dispatch: {}    # 手動実行も可能

permissions:
  contents: write

jobs:
  update:
    # 本番リポジトリ専用: ミラー側での自動コミットによる履歴分岐を防ぐ
    if: github.repository == 'matsuolab/pyhiroba'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # サプライチェーン対策としてコミットSHAで固定（Dependabotが更新を自動PR）
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Bump DOMPurify (latest 3.x, self-hosted)
        run: |
          set -euo pipefail
          DIR=vendor/dompurify

          # 現在のバージョンをファイル名から取得（例: purify-3.4.12.min.js）
          CUR_FILE=$(ls "$DIR"/purify-*.min.js | head -1)
          CUR_VER=$(echo "$CUR_FILE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "current version: $CUR_VER"

          # 最新の 3.x 系バージョンを npm レジストリから取得
          NEW_VER=$(curl -s https://registry.npmjs.org/dompurify \
            | grep -oE '"version":"3\.[0-9]+\.[0-9]+"' \
            | grep -oE '3\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "latest 3.x:      $NEW_VER"

          if [ -z "$NEW_VER" ]; then
            echo "最新バージョンを解決できませんでした"; exit 1
          fi
          if [ "$NEW_VER" = "$CUR_VER" ]; then
            echo "すでに最新です。更新なし。"; exit 0
          fi

          # 新バージョンをダウンロードして差し替え、nb/index.html（アプリ本体）の参照ファイル名を更新
          curl -sSL "https://cdn.jsdelivr.net/npm/dompurify@${NEW_VER}/dist/purify.min.js" \
            -o "$DIR/purify-${NEW_VER}.min.js"
          git rm -q "$DIR/purify-${CUR_VER}.min.js"
          sed -i "s#purify-${CUR_VER}.min.js#purify-${NEW_VER}.min.js#" nb/index.html

          # 参照の書き換えが実際に行われたか検証（空振りのまま旧ファイルを消すと
          # アプリが壊れるため、置換できていなければジョブを失敗させる）
          grep -q "purify-${NEW_VER}.min.js" nb/index.html || {
            echo "ERROR: nb/index.html の参照を更新できませんでした"; exit 1; }

          echo "CHANGED=1" >> "$GITHUB_ENV"
          echo "NEW_VER=$NEW_VER" >> "$GITHUB_ENV"

      - name: Commit & push
        if: env.CHANGED == '1'
        run: |
          set -euo pipefail
          git config user.name "Chakeo123"
          git config user.email "funakoshi@freinweb.com"
          git add -A vendor/dompurify nb/index.html
          git commit -m "DOMPurifyを${NEW_VER}に自動更新（自ホスト・ファイル差し替え）"
          git push
